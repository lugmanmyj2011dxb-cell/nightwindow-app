<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 眠窗 App 图标（矢量源文件）：海洋蓝底 + 暖金，仅此两色。
       所有平台图标都由这个文件渲染出来（scripts/render_icons.js），不要直接改导出的 png。
       v15：严格按用户红圈拼合，只保留四样东西——
         ① 图1红圈：拱窗 + 月牙
         ② 图1红圈：底部 NIGHT WINDOW 字标
         ③ 图2红圈：大花体 N（左竖拔起 → 顶部绕圈 → 斜划落下 → 右侧收锋）
         ④ 图3红圈：蜷缩睡人（闭眼 + 膝盖收向胸口）
       睡人做成实心剪影（图3本来就是剪影，细线条读不出人形）：头为实心圆、
       眼睛用 mask 挖空成月牙缝、身体用粗描边形成实心卷曲的躯干。 -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#11707C"/>
      <stop offset="0.55" stop-color="#0C525C"/>
      <stop offset="1" stop-color="#07343C"/>
    </linearGradient>
    <mask id="moonCut">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="456" cy="374" r="58" fill="#000"/>
    </mask>
    <mask id="eyeCut">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M302 506 Q 320 524 340 508" fill="none" stroke="#000"
            stroke-width="10" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g fill="none" stroke="#E9D7A8" stroke-width="22"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- ① 拱窗（两腿落地） -->
    <path d="M190 704 V 556 A 322 322 0 0 1 834 556 V 704"/>

    <!-- ③ 大花体 N（加宽到窗内宽度，顶部绕圈加大） -->
    <path d="M596 700
             C 610 596 630 466 656 394
             C 670 350 730 340 750 380
             C 764 412 742 448 706 438
             C 724 500 780 612 812 700
             C 820 678 824 650 826 624"/>

    <!-- ④ 躯干：粗描边实心剪影，背 → 臀 → 膝盖向前收（胎儿式蜷睡） -->
    <path d="M352 548 C 418 556 464 596 476 646" stroke-width="62"/>
    <path d="M476 646 C 480 682 452 702 412 700 C 392 699 380 688 382 674"
          stroke-width="52"/>
  </g>

  <!-- ④ 头（实心，闭眼用 mask 挖空） -->
  <circle cx="316" cy="516" r="46" fill="#E9D7A8" mask="url(#eyeCut)"/>

  <!-- ① 月亮（实心月牙） -->
  <circle cx="410" cy="390" r="70" fill="#E9D7A8" mask="url(#moonCut)"/>

  <!-- ② 字标 -->
  <text x="512" y="884" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="54" letter-spacing="10" fill="#E9D7A8" opacity="0.92">NIGHT WINDOW</text>
</svg>
