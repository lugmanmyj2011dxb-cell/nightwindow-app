# Codemagic CI/CD — Night Window iOS (Capacitor 8)
# 所需 Secrets（Codemagic → App settings → Environment variables，均勾选 Secure）：
#   APP_STORE_CONNECT_API_KEY_KEY_ID   = App Store Connect API Key 的 Key ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID= Issuer ID
#   APP_STORE_CONNECT_API_KEY_KEY      = AuthKey_xxxx.p8（类型选 File，上传该文件）

workflows:
  ios-release:
    name: Night Window iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lugman.nightwindow
      node: 22.23.3
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Capacitor sync (iOS)
        script: |
          npx cap sync ios

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --ipa-flags="--export-method app-store-connect"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY_KEY
        key_id: $APP_STORE_CONNECT_API_KEY_KEY_ID
        issuer_id: $APP_STORE_CONNECT_API_KEY_ISSUER_ID
        submit_to_testflight: true
