# Codemagic CI/CD — Night Window iOS (Capacitor 8)
# 需要的 Secrets（Codemagic → appsettings → Environment variables，组 appstore，均勾 Secure）：
#   APP_STORE_CONNECT_API_KEY_KEY_ID      Key ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID   Issuer ID
#   APP_STORE_CONNECT_API_KEY_KEY         AuthKey_xxx.p8 的文本内容（含 BEGIN/END 行）
#   IOS_P12_BASE64                        分发证书 .p12 的 base64（单行、无换行）
#   IOS_P12_PASSWORD                      .p12 密码

workflows:
  ios-release:
    name: Night Window iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore
      node: 22.23.3
      xcode: latest
      cocoapods: default
      vars:
        TEAM_ID: N9A8A7Y8WQ
        BUNDLE_ID: com.lugman.nightwindow
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Capacitor sync (iOS)
        script: |
          # pod install 依赖 CocoaPods CDN / Firebase 二进制源，偶发 504 时间，
          # 失败自动重试（已下载的缓存会保留，后续尝试更快）
          for i in 1 2 3 4; do
            echo "=== cap sync attempt $i ==="
            if npx cap sync ios; then
              echo "cap sync succeeded"
              exit 0
            fi
            echo "attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "cap sync failed after 4 attempts"
          exit 1

      - name: Import signing assets
        script: |
          set -e
          KEYCHAIN=build.keychain
          security create-keychain -p nwpass "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p nwpass "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          printf '%s' "$IOS_P12_BASE64" | tr -d '[:space:]' | openssl base64 -d -A > /tmp/nw.p12
          security import /tmp/nw.p12 -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k nwpass "$KEYCHAIN"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_KEY_ID}.p8

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Archive
        script: |
          set -e
          cd ios/App
          # 不要在命令行传 CODE_SIGN_IDENTITY：它会作用到 Pods 里的每个子 target
          # （如 GoogleUtilities），导致「automatically signed 但手动指定了证书」冲突。
          # Release + Automatic 会自动选 Apple Distribution 证书。
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Export IPA
        script: |
          set -e
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>N9A8A7Y8WQ</string>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Upload to TestFlight
        script: |
          set -e
          IPA=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip
