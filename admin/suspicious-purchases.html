<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>眠窗 · 可疑折扣购买查看器（开发者自用，不随App打包）</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#222;}
  h1{font-size:20px;}
  p.hint{color:#666;font-size:14px;line-height:1.6;}
  .setupBox{background:#f6f6f8;border-radius:8px;padding:16px;margin:16px 0;}
  label{display:block;margin:10px 0 4px;font-size:13px;color:#444;}
  input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
  button{margin-top:14px;padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;font-size:14px;cursor:pointer;}
  button:disabled{background:#aaa;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px;}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;word-break:break-all;}
  th{background:#f0f0f2;}
  .empty{color:#888;margin-top:20px;}
  .err{color:#c0392b;margin-top:10px;}
</style>
</head>
<body>
  <h1>眠窗 · 可疑折扣购买查看器</h1>
  <p class="hint">
    这个页面只是一个本地小工具，给你自己在电脑上打开用的——它<b>不会</b>被打包进App，也不会上架，
    不需要部署到任何地方，双击这个 .html 文件用浏览器打开就能用。<br>
    它做的事：调用你自己 Firebase 项目里的 <code>listSuspiciousDiscountPurchases</code> 这个云函数，
    把"年付→终身补差价升级"这个折扣商品里，购买前不是年付会员却买到了折扣价的记录列出来，
    方便你人工核对、决定要不要联系 Apple/Google 申请退款。
  </p>

  <div class="setupBox">
    <label>云函数地址（Function URL）——部署后 Firebase 控制台会给你一个链接，形如
      https://你的区域-你的项目id.cloudfunctions.net/listSuspiciousDiscountPurchases</label>
    <input id="fnUrl" placeholder="https://xxx.cloudfunctions.net/listSuspiciousDiscountPurchases">

    <label>管理口令——就是你在 functions/index.js 里设置的那个 WEBHOOK_SHARED_SECRET，
      原样填进来（这个页面只会把它存在你自己这台电脑的浏览器本地，不会发给任何其他人/服务器）</label>
    <input id="secret" type="password" placeholder="跟 WEBHOOK_SHARED_SECRET 一致">

    <button id="queryBtn" onclick="runQuery()">查询可疑记录</button>
  </div>

  <div id="result"></div>

<script>
  // 只存在这台电脑的浏览器本地（localStorage），方便下次打开不用重新输入——
  // 不会同步到任何账号、也不会被这个App的其它任何部分读取到，这个页面本身也完全独立于App代码。
  (function(){
    const u = localStorage.getItem('nw_admin_fnUrl');
    const s = localStorage.getItem('nw_admin_secret');
    if(u) document.getElementById('fnUrl').value = u;
    if(s) document.getElementById('secret').value = s;
  })();

  async function runQuery(){
    const fnUrl = document.getElementById('fnUrl').value.trim();
    const secret = document.getElementById('secret').value.trim();
    const resultEl = document.getElementById('result');
    const btn = document.getElementById('queryBtn');
    if(!fnUrl || !secret){
      resultEl.innerHTML = '<p class="err">云函数地址和管理口令都要填。</p>';
      return;
    }
    localStorage.setItem('nw_admin_fnUrl', fnUrl);
    localStorage.setItem('nw_admin_secret', secret);
    btn.disabled = true;
    resultEl.innerHTML = '<p class="hint">查询中…</p>';
    try{
      const resp = await fetch(fnUrl, { headers: { 'Authorization': 'Bearer ' + secret } });
      if(!resp.ok){
        const body = await resp.text();
        resultEl.innerHTML = '<p class="err">查询失败（HTTP ' + resp.status + '）：' + body.replace(/</g,'&lt;') + '</p>';
        return;
      }
      const data = await resp.json();
      if(!data.results || data.results.length === 0){
        resultEl.innerHTML = '<p class="empty">目前没有被标记的可疑记录。</p>';
        return;
      }
      let html = '<p>共 ' + data.count + ' 条：</p><table><tr><th>appUserId</th><th>来源表</th><th>商品ID</th><th>当前是否会员</th><th>source字段</th><th>最近一次更新时间</th></tr>';
      data.results.forEach(r=>{
        const t = r.lastEventTimeMs ? new Date(r.lastEventTimeMs).toLocaleString() : '（无）';
        html += '<tr><td>'+esc(r.appUserId)+'</td><td>'+esc(r.collection)+'</td><td>'+esc(r.productId)+'</td><td>'+(r.isPremium?'是':'否')+'</td><td>'+esc(r.source)+'</td><td>'+t+'</td></tr>';
      });
      html += '</table>';
      resultEl.innerHTML = html;
    }catch(e){
      resultEl.innerHTML = '<p class="err">请求出错：' + esc(String(e)) + '（常见原因：云函数地址填错，或者这个函数还没部署/没配置好 WEBHOOK_SHARED_SECRET）</p>';
    }finally{
      btn.disabled = false;
    }
  }
  function esc(s){ return (s==null?'':String(s)).replace(/</g,'&lt;'); }
</script>
</body>
</html>
